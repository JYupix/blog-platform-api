name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build
        run: npm run build

      - name: Run tests
        run: |
          if npm run | grep -q "test:ci"; then
            npm run test:ci
          elif npm run | grep -q "test"; then
            npm test -- --runInBand --coverage
          else
            echo "No test script found yet. Skipping tests."
          fi